<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TranslateAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- 头部 -->
    <header class="pp-header">
      <div class="pp-id">
        <span class="pp-avatar" aria-hidden="true">译</span>
        <div class="pp-name">
          <strong>TranslateAI</strong>
          <span class="pp-sub">词库 · 大模型</span>
        </div>
      </div>
      <label class="pp-switch">
        <span>划词翻译</span>
        <span class="switch">
          <input type="checkbox" id="hoverToggle">
          <span class="slider"></span>
        </span>
      </label>
    </header>

    <!-- 语言对 -->
    <div class="pair">
      <select id="sourceLang" class="pill-select" aria-label="源语言">
        <option value="auto" selected>自动检测</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
      <button class="pair-arrow" id="swapBtn" title="交换语言" aria-label="交换语言">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h16"></path>
          <path d="m14 6 6 6-6 6"></path>
        </svg>
      </button>
      <select id="targetLang" class="pill-select" aria-label="目标语言">
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="it">Italiano</option>
        <option value="th">ไทย</option>
        <option value="vi">Tiếng Việt</option>
        <option value="tr">Türkçe</option>
        <option value="hi">हिन्दी</option>
        <option value="id">Bahasa Indonesia</option>
      </select>
    </div>

    <!-- 输入 -->
    <div class="input-card">
      <textarea id="inputText" placeholder="输入或粘贴要翻译的文本…" rows="3"></textarea>
    </div>

    <!-- 主按钮 -->
    <button id="translateBtn" class="cta">
      <span class="btn-text">翻译</span>
      <span class="btn-loading" style="display:none;">
        <span class="spinner"></span> 翻译中…
      </span>
      <kbd class="cta-hint">Enter</kbd>
    </button>

    <!-- 翻译结果 -->
    <div class="result-area" id="resultArea" style="display:none;">
      <div class="result-header">
        <span class="result-label">译文</span>
        <span class="result-source" id="resultSource"></span>
      </div>
      <p class="result-text" id="resultText"></p>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <button id="translatePageBtn" class="soft-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 3v5h5"></path>
          <path d="M9 13h6M9 17h4"></path>
        </svg>
        翻译当前页
      </button>
      <button id="toggleMode" class="soft-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h9M4 7l3-3M4 7l3 3"></path>
          <path d="M20 17h-9M20 17l-3-3M20 17l-3 3"></path>
        </svg>
        <span id="modeLabel">词库优先</span>
      </button>
    </div>

    <!-- 底部 -->
    <footer class="pp-footer">
      <button id="openOptions" class="footer-link">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5 2 2 0 1 1-4 0 1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1 2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9 2 2 0 1 1 2.8-2.8 1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5 2 2 0 1 1 4 0 1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1 2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.5 1z"></path>
        </svg>
        设置
      </button>
      <span class="footer-stat">词库 <b id="dictCount">0</b></span>
      <span class="footer-stat">AI <b id="llmStatus">未配置</b></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
